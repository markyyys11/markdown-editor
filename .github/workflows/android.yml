name: Android APK

# Builds an installable release APK. The release build type is signed with the
# committed debug keystore (see android/app/build.gradle), which is enough to
# sideload the file onto a phone; a store build would need a real keystore
# supplied through repository secrets.
#
# A GitHub Release with the APK attached is published when the workflow runs on
# a `v*` tag, or when a manual run names a tag in the `tag` input. Every other
# run (pushes to main, pull requests, untagged manual runs) only uploads the APK
# as a workflow artifact.
on:
  workflow_dispatch:
    inputs:
      abis:
        description: 'ABIs to build (reactNativeArchitectures)'
        required: false
        default: arm64-v8a
      tag:
        description: 'Tag to publish a release for (leave empty to only build)'
        required: false
        default: ''
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

# A newer run on the same ref cancels the one before it, so a rapid sequence of
# pushes does not queue up a pile of Gradle builds.
concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Publishing a release and, for a manual run, its tag needs write access.
# Pull-request runs from forks are downgraded automatically and never reach the
# release steps.
permissions:
  contents: write

jobs:
  apk:
    name: Build release APK
    runs-on: ubuntu-latest
    # Compiling the New Architecture C++ for even one ABI is slow; a whole build
    # fits well inside this, and the cap keeps a hung Gradle from stalling.
    timeout-minutes: 90
    env:
      # Non-empty only when this run should publish a release: a v* tag push, or
      # a manual run that names one.
      RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.tag }}
    steps:
      - name: Check out
        uses: actions/checkout@v4

      # The React Native Gradle plugin pins the Java 17 toolchain, so the JDK
      # that ships with the runner (21+) is rejected.
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.11'
          cache: npm

      # android/build.gradle pins compileSdk 36, build-tools 36.0.0 and NDK
      # 27.1.12297006. The runner image rarely carries exactly these versions,
      # so install them rather than hoping the preinstalled SDK matches.
      #
      # `packages` must be given explicitly: this action defaults to
      # "tools platform-tools", and `tools` is no longer in the SDK repository,
      # so its own sdkmanager call fails with "Failed to find package 'tools'"
      # before any of our steps run.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: >-
            platform-tools
            platforms;android-36
            build-tools;36.0.0
            ndk;27.1.12297006

      - name: Install dependencies
        run: npm ci

      # The same gates the project uses locally, run before the build so a
      # broken commit never produces an APK.
      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      # A Windows checkout loses the executable bit, so restore it explicitly.
      - name: Make the Gradle wrapper executable
        run: chmod +x android/gradlew

      # assembleRelease also drives the Metro bundler through the React Native
      # Gradle plugin, which is why node_modules must be present (npm ci above).
      - name: Assemble release APK
        working-directory: android
        env:
          ABIS: ${{ inputs.abis || 'arm64-v8a' }}
        run: ./gradlew assembleRelease -PreactNativeArchitectures="$ABIS" --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: markdown-editor-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      # Give the asset a name that says what it is once it is downloaded from the
      # release page, instead of Gradle's generic app-release.apk.
      - name: Name the APK after the release
        if: env.RELEASE_TAG != ''
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk \
            "dist/markdown-editor-${RELEASE_TAG}.apk"

      # `overwrite_files` defaults to true, so re-running a failed job for the
      # same tag replaces the asset rather than failing on it.
      - name: Publish the release
        if: env.RELEASE_TAG != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_TAG }}
          # Pins a tag created for a manual run to the commit that was built.
          target_commitish: ${{ github.sha }}
          files: dist/*.apk
          fail_on_unmatched_files: true
          generate_release_notes: true
